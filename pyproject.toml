"core/domains/market/market_grid.py" = ["E501"]
"core/domains/market/market_grid_compute.py" = ["E501"]
"core/domains/market/pulse.py" = ["E501"]
"core/domains/market/search_metrics.py" = ["E501"]
"core/domains/market/situation.py" = ["E501"]
"core/domains/market/*.py" = ["E501"]
"core/domains/market/salary_calibration/*.py" = ["E501"]
"core/domains/market/salary_calibration/salary_extract.py" = ["E501"]
"core/config.py" = ["E501"]
"core/platform/db/pool.py" = ["E501"]
"core/domains/preparation/interview/company_profiles.py" = ["E501"]
"core/domains/preparation/interview/debrief.py" = ["E501"]
"core/domains/preparation/interview/debrief_resolution.py" = ["E501"]
"core/domains/preparation/interview/prep.py" = ["E501"]
"core/domains/preparation/interview/prep_pack.py" = ["E501"]
"core/platform/llm/openrouter_chat.py" = ["E501"]
"core/domains/preparation/vacancy_context.py" = ["E501"]
"core/domains/preparation/prompts.py" = ["E501"]
"core/domains/preparation/debrief.py" = ["E501"]
"core/domains/market/market_snapshot.py" = ["E501"]
"core/domains/preparation/screening_questions.py" = ["E501"]
"core/domains/preparation/interview_stages.py" = ["E501"]
"core/domains/preparation/*.py" = ["E501"]
"core/domains/preparation/screening/*.py" = ["E501"]
"core/domains/offers/models.py" = ["E501"]
