"core/domains/opportunities/recalibrate.py" = ["E501"]
"core/domains/opportunities/salary_estimator.py" = ["E501"]
"core/domains/opportunities/scorer.py" = ["E501"]
"core/domains/opportunities/discovery.py" = ["E501"]
"core/domains/opportunities/jobs.py" = ["E501"]
"core/domains/opportunities/skipped.py" = ["E501"]
"core/domains/opportunities/companies/backfill.py" = ["E501"]
"core/domains/profile/profile.py" = ["E501"]
"core/domains/offers/offer_compare.py" = ["E501"]
"api/routers/meta/meta.py" = ["E501"]
"api/routers/opportunities/skipped.py" = ["E501"]
"api/routers/pipeline/cover_letter.py" = ["E501"]
"api/routers/pipeline/hr_threads.py" = ["E501"]
"api/routers/pipeline/negotiations.py" = ["E501"]
"api/routers/assistant/notes.py" = ["E501"]
"core/domains/market/job_stats.py" = ["E501"]
"core/domains/opportunities/getmatch_sync.py" = ["E501"]
"core/domains/opportunities/score_revision.py" = ["E501"]
"core/domains/offers/offer_negotiation.py" = ["E501"]
"core/domains/offers/hh_negotiations.py" = ["E501"]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
include = ["core", "api", "bot_app"]
exclude = ["**/__pycache__", "tests"]
# Lazy __getattr__ — домены с ленивым импортом используют этот паттерн намеренно,
# pyright не может резолвить __all__ через __getattr__ (reportUnsupportedDunderAll).
reportUnsupportedDunderAll = false

# Контракты — правило слоёв из docs/ARCHITECTURE.md («Правила зависимостей»), 1:1.
[tool.importlinter]
root_packages = ["core", "api", "bot_app"]
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "core layers: app > domains > kernel"
type = "layers"
layers = [
    "core.app",
    "core.domains",
    "core.kernel",
]
# core.app.pipeline — чистый оркестратор без доменного знания, единственное разрешённое
# исключение из «домены не импортируют app» (docs/ARCHITECTURE.md, правило 4).
ignore_imports = ["core.domains.** -> core.app.pipeline"]

[[tool.importlinter.contracts]]
name = "platform не импортирует kernel/domains/app/api/bot_app"
type = "forbidden"
source_modules = ["core.platform"]
forbidden_modules = ["core.kernel", "core.domains", "core.app", "api", "bot_app"]
# LlmFeature-реестр (A-06): platform.llm.registry.ensure_features_loaded() лениво (внутри
# функции, не на верхнем уровне модуля) импортирует domains/*/llm.py ради побочного эффекта
# регистрации — единственный намеренный разворот направления в системе.
ignore_imports = ["core.platform.llm.registry -> core.domains.**"]

[[tool.importlinter.contracts]]
name = "kernel не импортирует platform (только stdlib/pydantic)"
type = "forbidden"
source_modules = ["core.kernel"]
forbidden_modules = ["core.platform"]

[[tool.importlinter.contracts]]
name = "core (domains/app) не импортирует api/bot_app"
type = "forbidden"
source_modules = ["core.domains", "core.app"]
forbidden_modules = ["api", "bot_app"]
