# Корень проекта. Плоская раскладка: пакеты core/ api/ bot_app/ лежат прямо в корне и
# импортируются через pythonpath/cwd (без uv-workspace и editable-install). uv держит
# окружение и зависимости; сам корень пакетом не собирается (package = false).
[project]
name = "work-hunting"
version = "0.1.0"
description = "Career & Relocation Copilot — плоский одно-процессный рантайм (core + api + bot_app)"
requires-python = ">=3.11,<3.15"
dependencies = [
    # --- Рантайм apps (api + bot) ---
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.3",
    "python-multipart>=0.0.9",
    "aiogram>=3.30.0",
    "aiohttp>=3.11.18",
    "rich>=14.2.0",
    "click>=8.1.8",
    # --- Ядро core: контракты, LLM-слой, БД, оркестратор ---
    "pydantic>=2.11.4",
    "pydantic-settings>=2.9.1",
    "httpx[http2]>=0.28.1",
    "h2>=4.1.0",
    "socksio>=1.0.0",
    "python-dotenv>=1.1.0",
    "langchain-core>=1.5.5",
    "langsmith>=0.11.0",
    "asyncpg>=0.30.0",
    # YAML-конфиги (weights_spec и прочие).
    "pyyaml>=6.0",
    # PDF резюме (core/domains/profile/parse_pdf.py) + текстовые вложения (core/kernel/text/extract.py).
    "pypdf>=6.16.0",
    # DOCX-вложения (core/kernel/text/extract.py).
    "python-docx>=1.1.2",
    # PNG-карточки скоринга в Telegram (bot_app/services/card_image.py, TB-5).
    "pillow>=11",
    # IANA tz database for zoneinfo on Windows (stdlib ZoneInfo has no bundled data there).
    "tzdata>=2025.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "pre-commit>=4.0",
    # R-02: анализ графа импортов (циклы, контракты слоёв).
    "grimp>=3.14",
    "import-linter>=2.0",
]

[tool.uv]
package = false
default-groups = ["dev"]

# --- Тесты (перенесено из pytest.ini) ---
[tool.pytest.ini_options]
asyncio_mode = "auto"
# Корень репо в sys.path — импорты core/api/bot_app без установки пакета.
pythonpath = ["."]
# llm-тесты делают реальные платные вызовы, db-тесты требуют живой Postgres — оба по умолчанию
# исключены (гонять: pytest -m llm / pytest -m db).
addopts = "-m 'not llm and not db'"
markers = [
    "llm: integration tests that call the real LLM API (require OPENROUTER_API_KEY)",
    "db: integration tests that require a live Postgres (RLS cannot be mocked)",
]

# --- Линт/формат ---
[tool.ruff]
line-length = 100
target-version = "py311"
include = ["core/**/*.py", "api/**/*.py", "bot_app/**/*.py"]
# Операторские скрипты и тесты линтуем отдельно/не линтуем. force-exclude в pre-commit
# заставляет ruff уважать этот список даже при явной передаче файлов хуком.
extend-exclude = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI-идиома: Query/Depends/Path/Body в дефолтах параметров — не B008 (это контракт, не мутабельный дефолт).
extend-immutable-calls = [
    "fastapi.Query",
    "fastapi.Depends",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.UploadFile",
]

[tool.ruff.lint.per-file-ignores]
# FR2-60: E501 — литералы промптов/логов/docstring'ов (перенос мнёт текст или лог-сообщение).
# Обычный код вынесен/перенесён точечно; ниже — файлы, где длина почти всегда в литералах.
"api/routers/assistant/conversations.py" = ["E501"]
"api/routers/preparation/debrief.py" = ["E501"]
"api/routers/offers/offers.py" = ["E501"]
"api/routers/profile/settings.py" = ["E501"]
