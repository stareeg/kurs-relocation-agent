"bot_app/services/prep_scheduler.py" = ["E501"]
"bot_app/services/vacancy_card.py" = ["E501"]
"core/domains/assistant/service.py" = ["E501"]
"core/domains/profile/model.py" = ["E501"]
"core/domains/profile/parse_pdf.py" = ["E501"]
"core/domains/profile/resume_stats.py" = ["E501"]
