name: Deploy

# Сборка образов на ВМ: workflow только заходит по SSH и запускает deploy/remote_up.sh
# (git fetch main → docker compose build → migrate → up). В Actions образы не собираются
# и в реестр не пушатся.
#
# Запуск только вручную, когда на main уже накопились коммиты и стенд пора обновить.
# На каждый push не вешаемся: репозиторий публичный, минуты раннеров бесплатные, но
# сборка на ВМ долгая и на 4 ГБ её не стоит гонять часто.
# Перед SSH проверяем, что последний CI на main зелёный. Иначе красный main уехал бы на стенд.
#
# Секреты (Settings → Secrets and variables → Actions), один раз:
#   DEPLOY_HOST     — IP ВМ
#   DEPLOY_USER     — пользователь deploy
#   DEPLOY_SSH_KEY  — приватный ключ только для этого пользователя
#   DEPLOY_PORT     — опционально, порт sshd (дефолт 22)
# Переменная DEPLOY_ENABLED=true включает кнопку. Без неё ручной запуск пропускается.
#
# Обход, если Actions недоступны:
#   .\deploy\deploy_prod.ps1            # тот же remote_up.sh по SSH

on:
  # `{}` обязателен: голый `workflow_dispatch:` даёт startup_failure без jobs.
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  # Новый Deploy (в т.ч. ручной) снимает предыдущий queued/in_progress — иначе при
  # инциденте runners копится «вечный» queued и блокирует группу навсегда.
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    # Кнопка молчит, пока переменная DEPLOY_ENABLED не включена.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Последний CI на main зелёный
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          conclusion=$(gh run list --workflow CI --branch main --limit 1 --json conclusion --jq '.[0].conclusion // "none"')
          echo "Последний CI на main: $conclusion"
          if [ "$conclusion" != "success" ]; then
            echo "Деплой не запускаю: на main нет зелёного CI."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Только remote_up.sh уходит на ВМ через script_path; checkout нужен локально runner'у.
          sparse-checkout: deploy
          fetch-depth: 1

      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_path: deploy/remote_up.sh
          # Долгий docker build на ВМ — дефолтный timeout ssh-action слишком короткий.
          command_timeout: 30m
