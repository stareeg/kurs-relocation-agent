# Спецификация весов overall_score (бывшая рубрика vacancy_fit).
# Держит методику и веса в синхроне с prompts/opportunities/instructions.md
# (tests/test_scoring_weights_sync.py). Конкретные предпочтения кандидата читаются
# из резюме в самом скоринге, а не здесь. Специальность-агностична.
name: weights_spec
description: >-
  Веса критериев фита вакансии под резюме. Содержание роли (стек/ниша) - самый тяжёлый
  критерий (Этап 4, plans/scoring_precision_2026_08_17.md §1.6/§4.1): единственная ось с
  измеренной предиктивной силой на решениях владельца (82 против 47 у откликнулся/не
  откликнулся), тогда как компания почти не разделяет, а зарплата внутри сильных вакансий
  даже инвертирована. Зарплата и формат работы - жёсткие дилбрейкеры; грейд и компания
  смягчены (10 каждая) в пользу содержания роли. Веса повторяют приоритеты из instructions.md.
threshold: 0.6
scale: 5
criteria:
  - name: salary
    weight: 20
    description: >-
      Зарплата (жёсткий критерий 1) относительно сумм из резюме кандидата («Желаемая» и
      «Комфортная»). Модель только сообщает вилку (value_or_range) и meets_min по тексту
      вакансии - баллы считает калибровка непрерывной рампой по числам, а не по уровню 0-5:
      на уровне «комфортной» и выше - полный вес; между «желаемой» и «комфортной» - плавный
      рост; ровно «желаемая» - 0.8 веса; ниже - плавное падение до пола.
      Вилка не указана - нейтрально (норма для hh, НЕ штраф): её добивает сервис оценки, и
      оценённой вилке калибровка доверяет меньше, чем названной в вакансии.
  - name: work_format
    weight: 20
    description: >-
      Формат работы (жёсткий критерий 2) относительно допустимых форматов из резюме кандидата.
      5 - формат вакансии входит в допустимые (полная удалёнка по РФ - идеал, по миру - бонус);
      3 - формат не входит в допустимые, но вакансия гибкая (гибрид / «по договорённости» как компромисс);
      0 - формат вакансии обязателен и не входит в допустимые (офис без удалёнки, релокация) - дилбрейкер.
  - name: role_content
    weight: 25
    description: >-
      Близость стека/контента роли к приоритетным нишам кандидата (см. «Критерии поиска» резюме).
      Смотри реальные задачи, игнорируй маркетинговые ключевые слова в шапке вакансии. Самый
      тяжёлый критерий рубрики - единственный, который на практике разделяет «моё / не моё»
      (§1.6 плана). Балл смешивает эту оценку с детерминированным оверлапом требуемых навыков
      вакансии и key_skills/ниш резюме (§4.3) - формулировка ниже влияет только на твою часть.
      5 - явное совпадение с приоритетной нишей/ключевыми навыками кандидата в проде;
      3 - частичное совпадение, смежная тема;
      0 - домен/стек, явно не связанный ни с одной нишей, ни с ключевыми навыками кандидата.
  - name: grade_match
    weight: 10
    description: >-
      Грейд и тип роли (предпочтение) относительно допустимых грейдов из резюме кандидата.
      5 - грейд вакансии входит в допустимые, с владением направлением и архитектурой;
      3 - грейд чуть ниже допустимых, либо смежная тема, либо сдвиг «руками vs управление»
      относительно того, что кандидат указал в «Чем занимаетесь» (off_profile_kind=role_shift);
      0 - грейд заметно ниже допустимых, generic backend под видом целевой ниши,
      роль в чужом домене или другая специальность (off_profile_kind=other_profession).
  - name: management
    weight: 15
    description: >-
      Доля управления людьми в роли (burnout_risk.level). Модель только измеряет долю, знак
      («хорошо / плохо») задаёт role_kind кандидата из резюме - в спеке направления нет.
      low - мало людей, в основном своя работа; medium - techlead без прямых подчинённых,
      кросс-функциональные инициативы; high - people-management (команда 8+, 1:1, статусы,
      ответственность за чужие дедлайны).
  - name: company
    weight: 10
    description: >-
      Размер и репутация компании относительно предпочтений кандидата.
      5 - сильный продукт / известный бренд / адекватный масштаб под роль;
      3 - нормальная компания без явных красных флагов, мало сигнала;
      0 - аутсорс/аутстафф сомнительного качества, токсичная репутация, явный мисматч.

second_job:
  description: >-
    Рубрика второго трека (Э2.4). Гибкость и совместимость считаются детерминированно
    из vacancy_work_terms, без нового LLM-суждения. Ставка — в валюте JD против корпуса
    той же валюты, без FX.
  criteria:
    - name: flexibility
      weight: 25
      description: >-
        Асинхронность, тайм-трекер, созвоны, онколл. Нет данных — нейтраль, не штраф.
    - name: role_content
      weight: 25
      description: >-
        То же LLM-суждение и оверлап навыков, что в основном треке.
    - name: compat
      weight: 20
      description: >-
        Пересечение часов, форма найма, география относительно InternationalReadiness.
    - name: rate
      weight: 20
      description: >-
        Ставка в валюте вакансии против медианы корпуса той же валюты и периода.
        Мало наблюдений (<8) — нейтраль.
    - name: company
      weight: 10
      description: >-
        Риск неплатежа и репутация заказчика. Та же ось company_fit.
