# WebSocket-апгрейд для партии «Хрюши и Волки» (/api/multiplayer/ws/). nginx не пересылает
# hop-by-hop заголовки апстриму, поэтому Upgrade/Connection надо проставить руками. Значение
# Connection обязано зависеть от того, пришёл ли Upgrade: захардкоженный "upgrade" сломал бы
# обычные HTTP-запросы, если такие попадут под тот же location.
# `map` валиден только в http{} — этот файл подключается из conf.d/*.conf, то есть уже внутри него.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Раньше бандл (JS/CSS/шрифты) отдавался несжатым — ~1.6 МБ вместо ~490 КБ. Caddy перед нами
    # компрессию не делает (нет `encode` в deploy/Caddyfile), так что это единственное звено.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript
        text/javascript application/wasm image/svg+xml font/woff2;

    # Vite/Rolldown хэширует имена файлов в /assets/ — при смене содержимого меняется URL,
    # поэтому этим файлам безопасно ставить долгий immutable-кеш. index.html — наоборот, must
    # revalidate каждый раз, иначе браузер годами держит старую SPA-оболочку с ссылками на
    # уже не существующие хэшированные чанки.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # WS партии — отдельным location, потому что общий /api/ ниже зачищает Connection
    # (`""` нужен keep-alive к апстриму и SSE) и не пересылает Upgrade: handshake не доходил до
    # uvicorn, браузер получал мгновенный close, а клиент крутил «переподключение (N/8)…».
    # `^~` — чтобы префикс гарантированно выиграл, даже если в конфиге появится regex-location.
    # proxy_buffering/таймауты повторяем явно: директивы наследуются от server/http, а не от
    # соседнего location, поэтому иначе тут действовал бы дефолтный proxy_read_timeout 60s.
    # Сегодня он бы и не выстрелил — uvicorn сам шлёт протокольный ping раз в ~20с и сбрасывает
    # отсчёт (проверено на проде), — но это его настройка по умолчанию, а не наша гарантия:
    # поднимут ws_ping_interval или выключат его, и вернётся обрыв на длинных фазах.
    location ^~ /api/multiplayer/ws/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API-пути проксируем на сервис api → браузер ходит на один origin (cookie/SSE без CORS-возни).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # SSE-стрим /api/events/stream: без буферизации, длинный таймаут.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location /auth/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location = /score {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location = /health {
        proxy_pass http://api:8000;
    }

    # Пути расширения (hh.ru/getmatch.ru триаж) без /api-префикса — веб их не зовёт, но
    # расширение, если его apiBaseUrl указывает на origin этого стенда, ходит сюда напрямую.
    location /vacancies/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location /funnel {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location /skip {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # SPA-роутинг: всё остальное отдаём index.html.
    #
    # $uri/ здесь быть НЕ должно. Всё из frontend/public/ Vite кладёт в корень сборки как есть,
    # и `public/multiplayer/` (арт игры: card-back.svg, felt-noise.svg, paper-grain.svg…)
    # становится настоящим каталогом — то есть каталог ассетов раздела перекрывает маршрут
    # раздела. С `$uri/` nginx матчил его, редиректил /multiplayer → /multiplayer/, не находил
    # там index.html и при autoindex off отдавал 403. Ломались закладка, F5 на странице и
    # deep-link ?join=CODE из Э16.4 — ровно то, чем зовут друга за стол. Кликом внутри SPA
    # работало, потому что там запроса к nginx нет вовсе.
    #
    # Без `$uri/` любой такой каталог просто не мешает: /multiplayer → index.html, а
    # /multiplayer/paper-grain.svg по-прежнему отдаётся файлом ($uri его находит).
    # Дефект Д2, plans/wolves_game_deep_polish_2026_08_26.md.
    location / {
        try_files $uri /index.html;
    }
}
